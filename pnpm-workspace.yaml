packages:
  - "apps/*"
  - "libs/*"
  - "tests/*"
  - "tools/*"

# Keep a single-document lockfile for GitHub's dependency graph and Dependabot.
# Exact versions are enforced by engines.pnpm and the CI/Docker setup.
pmOnFail: ignore

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true

# Keep release-age protection explicit; security fixes must use exact-version exceptions.
minimumReleaseAge: 1440

overrides:
  "@types/node": 26.6.6
  # Tailwind Typography pins a selector-parser version that needs a security patch.
  # GHSA-rj75-hqrm-r3gf
  "@tailwindcss/typography>postcss-selector-parser": 6.1.6
  # Retain existing security exceptions only for the affected major lines.
  # Neither dependency has a patched release in its requested major.
  # GHSA-834v-8h66-3h79, GHSA-c8p4-j97h-3vg8
  "happy-dom@20": 21.0.4
  # GHSA-g3hv-75wg-m249
  "minimatch@10": 11.0.1
